<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professor IA 3.0</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>Professor IA 3.0</h1>
<p>Aprenda IA de forma interativa</p>
</header>

<section class="card">
<h2>As 3 Ondas</h2>
<button onclick="showWave(1)">1ª Onda</button>
<button onclick="showWave(2)">2ª Onda</button>
<button onclick="showWave(3)">3ª Onda</button>
<div id="wave"></div>
</section>

<section class="card">
<h2>Aprendizado Supervisionado x Não Supervisionado</h2>
<button onclick="showLearn('sup')">Supervisionado</button>
<button onclick="showLearn('nao')">Não Supervisionado</button>
<div id="learn"></div>
</section>

<section class="card">
<h2>AAS</h2>
<div class="aas">
<div>📚 Aprender</div>
<div>🔍 Analisar</div>
<div>✅ Solucionar</div>
</div>
<p>Fluxo usado pela IA para transformar dados em decisões.</p>
</section>

<section class="card">
<h2>Simulador de Treinamento</h2>
<button onclick="train()">Treinar IA</button>
<pre id="trainOut"></pre>
</section>

<section class="card">
<h2>Quiz</h2>
<p id="q"></p>
<div id="opts"></div>
<p id="result"></p>
</section>

<script src="script.js"></script>
</body>
</html>
